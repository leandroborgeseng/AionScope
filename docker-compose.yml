# AionScope / IndicadoresEC
#
# Local:  cp .env.example .env && docker compose up --build
#         App em http://localhost:3000
#         SQLite em volume aion-data → /data/aionscope.sqlite
#
# Railway: Dockerfile na raiz + Volume em Settings → Volumes (mount /data); não use VOLUME no Dockerfile
#   Variables: DATABASE_PATH=/data/aionscope.sqlite + tokens PBI_*

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - aion-data:/data
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: ${PORT:-3000}
      DATABASE_PATH: ${DATABASE_PATH:-/data/aionscope.sqlite}
      PBI_BASE_URL: ${PBI_BASE_URL:-https://sjh.globalthings.net}
      PBI_CACHE_SECONDS: ${PBI_CACHE_SECONDS:-900}
      PBI_TOKEN_CRONOGRAMA: ${PBI_TOKEN_CRONOGRAMA}
      PBI_TOKEN_TIPO_MANUTENCAO: ${PBI_TOKEN_TIPO_MANUTENCAO}
      PBI_TOKEN_OS_ANALITICO: ${PBI_TOKEN_OS_ANALITICO}
      PBI_TOKEN_EQUIPAMENTOS: ${PBI_TOKEN_EQUIPAMENTOS}
      PBI_TOKEN_TMEF: ${PBI_TOKEN_TMEF}
      PBI_TOKEN_TPM: ${PBI_TOKEN_TPM}
      PBI_TOKEN_DISP_EQUIPAMENTO: ${PBI_TOKEN_DISP_EQUIPAMENTO}
      PBI_TOKEN_DISP_EQUIPAMENTO_MES: ${PBI_TOKEN_DISP_EQUIPAMENTO_MES}
      PBI_TOKEN_MONITOR_REACAO: ${PBI_TOKEN_MONITOR_REACAO}
      PBI_TOKEN_MONITOR_ATENDIMENTO: ${PBI_TOKEN_MONITOR_ATENDIMENTO}
      PBI_TOKEN_ANEXOS_EQUIPAMENTO: ${PBI_TOKEN_ANEXOS_EQUIPAMENTO}
      PBI_TOKEN_ANEXOS_OS: ${PBI_TOKEN_ANEXOS_OS}
      PBI_TOKEN_OS_ANALITICO_RESUMIDO: ${PBI_TOKEN_OS_ANALITICO_RESUMIDO}
      PBI_TOKEN_OFICINA: ${PBI_TOKEN_OFICINA}
      PBI_DEFAULT_EMPRESA_IDS: ${PBI_DEFAULT_EMPRESA_IDS}
      NEXT_PUBLIC_ANEXOS_OBRIGATORIOS: ${NEXT_PUBLIC_ANEXOS_OBRIGATORIOS:-laudo,calibra,certificado,seguranca eletrica,segurança elétrica,tse}

volumes:
  aion-data:
